<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <!--Header: es la cabecera del body-->
    <header>
        <h1>Formulario</h1>
    </header>
    <!--Formulario-->
    <div>
        <form action="../index.html" method="get">
            <div>
                <!--Label=Me permite ingresar texto fijo-->
                <label for="">Ingrese el Nombre</label>
                <!--input-> caja para cerrar texto-->
                <input type="nombre" id="nombre">
               
            </div>
            <div>
                <label for="">Ingrese la edad</label>
                <input type="edad" id="edad">
            </div>
            <div>
                <label for="">Ingrese Correo Electronico</label>
                <input type="email" id="email">
            </div>
            <div>
                <label for="">Ingrese Dirección</label>
                <input type="direccion" id="direccion">
            </div>
            <!--Boton submit me permite enviar la
            petición o información-->
            <div>
                <input type="submit" value="Enviar">
            </div>
        </form>
        <!--Regresar a inicio-->
        <div>
            <a href="../index.html">Regresar a Home</a>
        </div>
    </div>
</body>
</html>
